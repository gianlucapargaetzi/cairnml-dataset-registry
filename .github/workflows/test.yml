name: adapters

# Every change to the default branch comes through a pull request that passes this. The branch is what
# training runs use when they ask for no particular commit, so it has to keep working.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The SDK is a public repository, so no token is needed.
      - uses: actions/checkout@v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: main
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./sdk[dataset]" pytest pyyaml
      - run: python -m pytest -q tests

  # The adapters run inside the SDK's python, so they must work on every version the SDK supports. The job above is
  # 3.12; its name is kept because it may be a required check.
  python-versions:
    name: python ${{ matrix.python }}
    # 24.04, not latest: setup-python has no Python 3.9 build for Ubuntu 26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gianlucapargaetzi/cairnml
          ref: main
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "./sdk[dataset]" pytest pyyaml
      - run: python -m pytest -q tests
